version: "3.9"

# ── Set GITHUB_OWNER in your .env file to your GitHub username ──────────────
# e.g.  GITHUB_OWNER=samsmith
# Image is pulled from: ghcr.io/GITHUB_OWNER/resume-builder:latest

services:
  app:
    image: ghcr.io/${GITHUB_OWNER}/resume-builder:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: "sqlite:////data/resume_builder.db"
      AI_PROVIDER: "${AI_PROVIDER:-claude}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      CLAUDE_MODEL: "${CLAUDE_MODEL:-claude-opus-4-5}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2}"
      STORAGE_PATH: "/data/files"
      SEARCH_PROVIDER: "${SEARCH_PROVIDER:-duckduckgo}"
      SERPAPI_KEY: "${SERPAPI_KEY:-}"
      SECRET_KEY: "${SECRET_KEY:-changeme-generate-a-real-secret}"
      DEBUG: "${DEBUG:-false}"
    volumes:
      - resume_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  resume_data:
    driver: local
