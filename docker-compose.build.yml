version: "3.9"

# Build images locally instead of pulling from registry.
# Usage: docker-compose -f docker-compose.yml -f docker-compose.build.yml up --build

services:
  api:
    image: resume-builder-api:local
    build:
      context: ./backend
      dockerfile: Dockerfile

  worker:
    image: resume-builder-api:local
    build:
      context: ./backend
      dockerfile: Dockerfile

  frontend:
    image: resume-builder-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
